<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket State Architecture (PSA™ v3.1) — Rean Van Aswegen</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: monospace; background: #050505; color: #f59e0b; margin: 0; padding: 8px; 
            display: flex; flex-direction: column; min-height: 100vh;
        }
        header { border-bottom: 1px solid #27272a; padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 0.85rem; margin: 0; color: #ffffff; letter-spacing: 1px; }
        .badge { background: #f59e0b; color: #050505; padding: 3px 8px; font-size: 0.58rem; border-radius: 4px; font-weight: bold; }
        .status { color: #10b981; font-size: 0.65rem; }
        .founder-plaque { background: #121216; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; text-align: center; }
        .plaque-title { font-size: 0.58rem; color: #a1a1aa; letter-spacing: 2px; text-transform: uppercase; }
        .plaque-name { font-size: 0.78rem; color: #ffffff; font-weight: bold; letter-spacing: 1px; }
        .plaque-sub { font-size: 0.6rem; color: #f59e0b; margin-top: 2px; font-weight: bold; }
        #toast-container { position: fixed; top: 10px; right: 10px; z-index: 999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { background: #09090b; border: 1px solid #10b981; color: #10b981; padding: 8px 12px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; pointer-events: auto; }
        .toast.error { border-color: #f87171; color: #f87171; }
        .main-layout { display: flex; gap: 8px; margin-bottom: 8px; }
        .sidebar { width: 170px; background: #09090b; border: 1px solid #27272a; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { background: #121216; padding: 6px 8px; font-size: 0.6rem; color: #a1a1aa; border-bottom: 1px solid #27272a; }
        .file-list { padding: 6px; display: flex; flex-direction: column; gap: 5px; }
        .file-item { background: #121216; border: 1px solid #27272a; color: #a1a1aa; padding: 6px 8px; font-size: 0.64rem; border-radius: 5px; cursor: pointer; }
        .file-item.active { border-color: #f59e0b; color: #f59e0b; font-weight: bold; }
        .workspace-grid { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .pane { background: #09090b; border: 1px solid #27272a; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .pane-header { background: #121216; padding: 6px 8px; font-size: 0.62rem; color: #71717a; border-bottom: 1px solid #27272a; }
        textarea { width: 100%; height: 200px; background: transparent; color: #f59e0b; border: none; padding: 10px; font-family: monospace; font-size: 0.72rem; outline: none; }
        iframe { width: 100%; height: 200px; background: #ffffff; border: none; }
        .terminal-container { background: #09090b; border: 1px solid #27272a; border-radius: 6px; display: flex; flex-direction: column; margin-bottom: 8px; }
        .terminal-logs { max-height: 80px; padding: 6px 10px; font-size: 0.58rem; overflow-y: auto; color: #10b981; line-height: 1.4; }
        .terminal-input-row { display: flex; border-top: 1px solid #27272a; background: #121216; align-items: center; }
        .terminal-prompt { padding: 4px 10px; color: #10b981; font-size: 0.58rem; font-weight: bold; }
        .terminal-input { flex: 1; background: transparent; border: none; color: #ffffff; font-family: monospace; font-size: 0.58rem; padding: 6px; outline: none; }
        .btn-group { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn { background: #f59e0b; color: #050505; border: none; padding: 8px 10px; font-weight: bold; flex: 1; min-width: 110px; border-radius: 6px; cursor: pointer; font-size: 0.65rem; text-align: center; }
        .btn-secondary { background: #18181b; color: #f59e0b; border: 1px solid #27272a; }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <header>
        <h1>PSA™ v3.1 CORE</h1>
        <span class="status">● ACTIVE</span>
    </header>

    <div class="founder-plaque">
        <div class="plaque-title">Sovereign Architecture Node</div>
        <div class="plaque-name">REAN VAN ASWEGEN</div>
        <div class="plaque-sub">INVENTOR & FOUNDER — POCKET STATE ARCHITECTURE (PSA™)</div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-header">📁 Files</div>
            <div class="file-list" id="file-list-container"></div>
        </div>
        <div class="workspace-grid">
            <div class="pane">
                <div class="pane-header" id="active-filename">EDITING: app.html</div>
                <textarea id="code-editor" oninput="updateActiveFile()"></textarea>
            </div>
            <div class="pane">
                <div class="pane-header">LIVE PREVIEW</div>
                <iframe id="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <div class="terminal-container">
        <div class="terminal-logs" id="terminal-logs">
            <p>> runtime: v3.1 multi-file workspace bridge active for Rean Van Aswegen.</p>
        </div>
        <div class="terminal-input-row">
            <span class="terminal-prompt">psa$</span>
            <input type="text" id="term-cmd" class="terminal-input" placeholder="type command (build, git push, vercel)..." onkeydown="handleTerm(event)">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" onclick="saveAndCommit()">SAVE & COMMIT</button>
        <button class="btn" onclick="pushToGit()">PUSH TO GIT</button>
        <button class="btn btn-secondary" onclick="deployToVercel()">DEPLOY VERCEL</button>
        <button class="btn btn-secondary" onclick="compileAndRender()">BUILD</button>
    </div>

    <script>
        let files = {};
        let currentFile = 'app.html';

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function loadFiles() {
            try {
                const res = await fetch('http://localhost:8080/api/files');
                files = await res.json();
                if (!files[currentFile]) {
                    currentFile = Object.keys(files)[0] || 'app.html';
                }
                renderFiles();
                document.getElementById('code-editor').value = files[currentFile] || '';
                document.getElementById('active-filename').innerText = "EDITING: " + currentFile;
                compileAndRender();
            } catch (err) {
                showToast("Failed to load workspace files", true);
            }
        }

        function renderFiles() {
            const container = document.getElementById('file-list-container');
            container.innerHTML = '';
            Object.keys(files).forEach(f => {
                if (f === 'index.html') return; // Don't clutter editor with IDE source itself
                const item = document.createElement('div');
                item.className = 'file-item' + (f === currentFile ? ' active' : '');
                item.innerText = f;
                item.onclick = () => {
                    currentFile = f;
                    document.getElementById('active-filename').innerText = "EDITING: " + f;
                    document.getElementById('code-editor').value = files[f];
                    renderFiles();
                };
                container.appendChild(item);
            });
        }

        function updateActiveFile() {
            files[currentFile] = document.getElementById('code-editor').value;
        }

        async function saveAndCommit() {
            updateActiveFile();
            showToast("Writing to local disk & committing...");
            const terminal = document.getElementById('terminal-logs');
            const timestamp = new Date().toLocaleTimeString();

            try {
                const saveRes = await fetch('http://localhost:8080/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: files })
                });
                const commitRes = await fetch('http://localhost:8080/api/commit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Manual commit for ${currentFile} at ${timestamp}` })
                });
                const commitData = await commitRes.json();

                if (saveRes.ok && commitRes.ok) {
                    showToast("✅ Saved & Committed!");
                    terminal.innerHTML += '<p>> [' + timestamp + '] Disk Sync & Commit Successful!</p>';
                } else {
                    throw new Error(commitData.output || "Failed");
                }
            } catch (err) {
                showToast("❌ Error: " + err.message, true);
                terminal.innerHTML += '<p style="color: #f87171;">> Error: ' + err.message + '</p>';
            }
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function pushToGit() {
            showToast("Pushing to git...");
            const res = await fetch('http://localhost:8080/api/push', { method: 'POST' });
            if (res.ok) showToast("✅ Pushed to Git!");
            else showToast("❌ Push failed", true);
        }

        async function deployToVercel() {
            showToast("Deploying to Vercel...");
            const res = await fetch('http://localhost:8080/api/vercel', { method: 'POST' });
            if (res.ok) showToast("✅ Vercel Deploy Live!");
            else showToast("❌ Deployment failed", true);
        }

        function compileAndRender() {
            const iframe = document.getElementById('preview-frame');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(files[currentFile] || '');
            doc.close();
            showToast("Build compiled!");
        }

        function handleTerm(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('term-cmd');
                const cmd = input.value.trim().toLowerCase();
                if (!cmd) return;
                input.value = '';
                if (cmd === 'build') compileAndRender();
                else if (cmd === 'git push') pushToGit();
                else if (cmd === 'vercel' || cmd === 'deploy') deployToVercel();
            }
        }

        window.onload = loadFiles;
    </script>
</body>
</html>
