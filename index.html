<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA™ Master IDE & Runtime</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: monospace; 
            background: #050505; 
            color: #f59e0b; 
            margin: 0; 
            padding: 10px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header { 
            border-bottom: 1px solid #27272a; 
            padding-bottom: 8px; 
            margin-bottom: 8px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 0.95rem; margin: 0; color: #ffffff; letter-spacing: 1px; }
        .badge { background: #d97706; color: #050505; padding: 2px 6px; font-size: 0.65rem; border-radius: 4px; font-weight: bold; }
        .status { color: #10b981; font-size: 0.75rem; }
        
        .file-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab {
            background: #121216;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .tab.active {
            background: #18181b;
            border-color: #f59e0b;
            color: #f59e0b;
            font-weight: bold;
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
            min-height: 0;
        }
        
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            overflow: hidden;
        }

        .pane-header {
            background: #121216;
            padding: 5px 8px;
            font-size: 0.7rem;
            color: #71717a;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            background: transparent;
            color: #f59e0b;
            border: none;
            padding: 8px;
            font-family: monospace;
            font-size: 0.78rem;
            resize: none;
            outline: none;
        }

        iframe {
            flex: 1;
            background: #ffffff;
            border: none;
            width: 100%;
        }

        .terminal { 
            background: #09090b; 
            border: 1px solid #27272a; 
            padding: 6px 8px; 
            border-radius: 6px; 
            font-size: 0.7rem;
            height: 70px;
            overflow-y: auto;
            margin-bottom: 8px;
            color: #10b981;
        }
        
        .btn-group {
            display: flex;
            gap: 6px;
        }
        
        .btn { 
            background: #f59e0b; 
            color: #050505; 
            border: none; 
            padding: 10px; 
            font-weight: bold; 
            flex: 1; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.8rem;
        }
        .btn-secondary {
            background: #18181b;
            color: #f59e0b;
            border: 1px solid #27272a;
        }
        .btn:active { opacity: 0.8; }
        p { margin: 2px 0; }
    </style>
</head>
<body>
    <header>
        <h1>PSA™ MASTER IDE</h1>
        <div>
            <span class="badge">v1.3 PRO</span>
            <span class="status">● SECURE</span>
        </div>
    </header>

    <div class="file-tabs">
        <div class="tab active" onclick="switchFile('index.html')">index.html</div>
        <div class="tab" onclick="switchFile('app.py')">app.py</div>
        <div class="tab" onclick="switchFile('runtime.sh')">runtime.sh</div>
    </div>
    
    <div class="workspace-grid">
        <div class="pane">
            <div class="pane-header"><span id="active-filename">EDITING: index.html</span></div>
            <textarea id="code-editor" oninput="updateActiveFile()"></textarea>
        </div>

        <div class="pane">
            <div class="pane-header"><span>LIVE EDGE PREVIEW</span></div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <div class="terminal" id="terminal-logs">
        <p>> psa-master: core daemon online.</p>
        <p>> status: multi-file workspace ready.</p>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" onclick="saveWorkspace()">SAVE STATE</button>
        <button class="btn" onclick="compileAndRender()">COMPILE & RUN</button>
    </div>

    <script>
        let files = {
            'index.html': `<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { background: #09090b; color: #f59e0b; font-family: monospace; text-align: center; padding-top: 30px; }\n        h2 { border-bottom: 1px solid #f59e0b; display: inline-block; padding-bottom: 4px; }\n    </style>\n</head>\n<body>\n    <h2>PSA™ Obsidian Node</h2>\n    <p>Multi-file runtime fully operational.</p>\n    <button onclick="testLog()" style="background:#f59e0b;color:#000;border:none;padding:8px 14px;font-weight:bold;border-radius:4px;">Fire Signal</button>\n    <script>\n        function testLog() {\n            console.log("SUCCESS: Master runtime signal emitted.");\n            alert("PSA Master Node Verified!");\n        }\n    <\/script>\n</body>\n</html>`,
            'app.py': `# PSA Python Edge Engine\nimport sys\n\ndef init_node():\n    print("[+] Initializing Python kernel...")\n    return True\n\nif __name__ == "__main__":\n    init_node()`,
            'runtime.sh': `#!/bin/bash\n# PSA Shell Runtime Daemon\necho "Starting local edge container..."\npython3 -m http.server 8080`
        };

        let currentFile = 'index.html';

        function switchFile(filename) {
            currentFile = filename;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('active-filename').innerText = "EDITING: " + filename;
            document.getElementById('code-editor').value = files[filename];
        }

        function updateActiveFile() {
            files[currentFile] = document.getElementById('code-editor').value;
        }

        function saveWorkspace() {
            const terminal = document.getElementById('terminal-logs');
            localStorage.setItem('psa_master_workspace', JSON.stringify(files));
            terminal.innerHTML += `<p style="color: #f59e0b;">> [STATE] All workspace files saved to local mobile storage.</p>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function compileAndRender() {
            const terminal = document.getElementById('terminal-logs');
            const iframe = document.getElementById('preview-frame');
            const timestamp = new Date().toLocaleTimeString();
            
            terminal.innerHTML += `<p>> [${timestamp}] Compiling multi-file workspace...</p>`;
            
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(files['index.html']);
            doc.close();

            terminal.innerHTML += `<p style="color: #10b981;">> [${timestamp}] BUILD SUCCESS: Edge preview updated.</p>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        window.onload = () => {
            const saved = localStorage.getItem('psa_master_workspace');
            if (saved) {
                try { files = JSON.parse(saved); } catch(e) {}
            }
            document.getElementById('code-editor').value = files[currentFile];
            compileAndRender();
        };
    </script>
</body>
</html>
