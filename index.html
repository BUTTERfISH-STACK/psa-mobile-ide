<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA™ Master IDE & Runtime v1.4</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: monospace; 
            background: #050505; 
            color: #f59e0b; 
            margin: 0; 
            padding: 8px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header { 
            border-bottom: 1px solid #27272a; 
            padding-bottom: 6px; 
            margin-bottom: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 0.9rem; margin: 0; color: #ffffff; letter-spacing: 1px; }
        .badge { background: #d97706; color: #050505; padding: 2px 5px; font-size: 0.6rem; border-radius: 4px; font-weight: bold; }
        .status { color: #10b981; font-size: 0.7rem; }
        
        .file-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab {
            background: #121216;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .tab.active {
            background: #18181b;
            border-color: #f59e0b;
            color: #f59e0b;
            font-weight: bold;
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
            min-height: 0;
        }
        
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            overflow: hidden;
        }

        .pane-header {
            background: #121216;
            padding: 4px 8px;
            font-size: 0.65rem;
            color: #71717a;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            background: transparent;
            color: #f59e0b;
            border: none;
            padding: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            resize: none;
            outline: none;
        }

        iframe {
            flex: 1;
            background: #ffffff;
            border: none;
            width: 100%;
        }

        .terminal-container {
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 90px;
            margin-bottom: 6px;
            overflow: hidden;
        }
        
        .terminal-logs {
            flex: 1;
            padding: 6px;
            font-size: 0.68rem;
            overflow-y: auto;
            color: #10b981;
        }

        .terminal-input-row {
            display: flex;
            border-top: 1px solid #27272a;
            background: #121216;
        }

        .terminal-prompt {
            padding: 4px 6px;
            color: #f59e0b;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 4px;
            outline: none;
        }
        
        .btn-group {
            display: flex;
            gap: 4px;
        }
        
        .btn { 
            background: #f59e0b; 
            color: #050505; 
            border: none; 
            padding: 8px; 
            font-weight: bold; 
            flex: 1; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.75rem;
        }
        .btn-secondary {
            background: #18181b;
            color: #f59e0b;
            border: 1px solid #27272a;
        }
        .btn:active { opacity: 0.8; }
        p { margin: 2px 0; }
    </style>
</head>
<body>
    <header>
        <h1>PSA™ CORE IDE</h1>
        <div>
            <span class="badge">v1.4 SHELL</span>
            <span class="status">● ACTIVE</span>
        </div>
    </header>

    <div class="file-tabs">
        <div class="tab active" onclick="switchFile('index.html')">index.html</div>
        <div class="tab" onclick="switchFile('app.py')">app.py</div>
        <div class="tab" onclick="switchFile('runtime.sh')">runtime.sh</div>
    </div>
    
    <div class="workspace-grid">
        <div class="pane">
            <div class="pane-header"><span id="active-filename">EDITING: index.html</span></div>
            <textarea id="code-editor" oninput="updateActiveFile()"></textarea>
        </div>

        <div class="pane">
            <div class="pane-header"><span>LIVE EDGE PREVIEW</span></div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <div class="terminal-container">
        <div class="terminal-logs" id="terminal-logs">
            <p>> psa-core: interactive shell online.</p>
            <p>> type 'help' for available commands.</p>
        </div>
        <div class="terminal-input-row">
            <span class="terminal-prompt">psa$</span>
            <input type="text" id="terminal-cmd" class="terminal-input" placeholder="enter command..." onkeydown="handleTerminalCommand(event)">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" onclick="saveWorkspace()">SAVE</button>
        <button class="btn" onclick="compileAndRender()">COMPILE & RUN</button>
    </div>

    <script>
        let files = {
            'index.html': `<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { background: #050505; color: #f59e0b; font-family: monospace; text-align: center; padding-top: 30px; }\n        h2 { border-bottom: 1px solid #f59e0b; display: inline-block; padding-bottom: 4px; }\n    </style>\n</head>\n<body>\n    <h2>PSA™ Command Core</h2>\n    <p>v1.4 Interactive Shell Online.</p>\n    <button onclick="testLog()" style="background:#f59e0b;color:#000;border:none;padding:8px 14px;font-weight:bold;border-radius:4px;">Execute Signal</button>\n    <script>\n        function testLog() {\n            console.log("SUCCESS: v1.4 command core verified.");\n            alert("PSA Core Operational!");\n        }\n    <\/script>\n</body>\n</html>`,
            'app.py': `# PSA Python Core Engine\nimport sys\n\ndef run():\n    print("Executing offline runtime core...")\n\nif __name__ == '__main__':\n    run()`,
            'runtime.sh': `#!/bin/bash\n# PSA Shell Daemon\necho "Starting local environment..."\npython3 -m http.server 8080`
        };

        let currentFile = 'index.html';

        function switchFile(filename) {
            currentFile = filename;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('active-filename').innerText = "EDITING: " + filename;
            document.getElementById('code-editor').value = files[filename];
        }

        function updateActiveFile() {
            files[currentFile] = document.getElementById('code-editor').value;
        }

        function saveWorkspace() {
            const terminal = document.getElementById('terminal-logs');
            localStorage.setItem('psa_core_workspace', JSON.stringify(files));
            terminal.innerHTML += `<p style="color: #f59e0b;">> [STATE] Workspace saved to local storage.</p>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function compileAndRender() {
            const terminal = document.getElementById('terminal-logs');
            const iframe = document.getElementById('preview-frame');
            const timestamp = new Date().toLocaleTimeString();
            
            terminal.innerHTML += `<p>> [${timestamp}] Compiling workspace files...</p>`;
            
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(files['index.html']);
            doc.close();

            terminal.innerHTML += `<p style="color: #10b981;">> [${timestamp}] BUILD SUCCESS: Edge preview updated.</p>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function handleTerminalCommand(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('terminal-cmd');
                const cmd = input.value.trim();
                const terminal = document.getElementById('terminal-logs');
                
                if (!cmd) return;

                terminal.innerHTML += `<p style="color: #ffffff;">> psa$ ${cmd}</p>`;
                
                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();

                switch(command) {
                    case 'help':
                        terminal.innerHTML += `<p>Available: help, clear, status, ls, run, save</p>`;
                        break;
                    case 'clear':
                        terminal.innerHTML = `<p>> psa-core: interactive shell online.</p>`;
                        input.value = '';
                        return;
                    case 'status':
                        terminal.innerHTML += `<p style="color: #10b981;">> Status: ONLINE | Active File: ${currentFile} | Zero Cloud Dependencies</p>`;
                        break;
                    case 'ls':
                        terminal.innerHTML += `<p>index.html | app.py | runtime.sh</p>`;
                        break;
                    case 'run':
                        compileAndRender();
                        break;
                    case 'save':
                        saveWorkspace();
                        break;
                    default:
                        terminal.innerHTML += `<p style="color: #ef4444;">> Error: command not recognized. Type 'help'.</p>`;
                }

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('psa_core_workspace');
            if (saved) {
                try { files = JSON.parse(saved); } catch(e) {}
            }
            document.getElementById('code-editor').value = files[currentFile];
            compileAndRender();
        };
    </script>
</body>
</html>
